[project]
name = "clipulse-api"
version = "0.1.0"
description = "Clipulse API and dashboard backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.122,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1"
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1"
]

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 100
