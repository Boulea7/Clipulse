name: Beta Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  beta-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Build repo workspaces
        run: npm run build

      - name: Run stable adapter smoke
        run: npm run smoke:adapters:stable

      - name: Run experimental smoke (Gemini CLI)
        run: npm run smoke:gemini

      - name: Run experimental smoke (OpenCode)
        run: npm run smoke:opencode

      - name: Run repo tests
        run: npm run test

      - name: Run API lint
        run: npm run lint:api

      - name: Run stable self-hosted smoke
        run: npm run smoke:self-hosted
