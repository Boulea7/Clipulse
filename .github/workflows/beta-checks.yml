name: Beta Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  beta-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Run repo smoke guardrails
        run: npm run smoke:repo-guardrails

      - name: Build repo workspaces
        run: npm run build

      - name: Run repo tests
        run: npm run test

      - name: Run API lint
        run: npm run lint:api

      - name: Run stable smoke lane
        run: npm run smoke:stable

      - name: Run experimental smoke lane
        id: experimental_smoke
        continue-on-error: true
        run: npm run smoke:experimental

      - name: Run Gemini smoke diagnostic
        if: ${{ steps.experimental_smoke.outcome == 'failure' }}
        continue-on-error: true
        run: npm run smoke:gemini

      - name: Run OpenCode smoke diagnostic
        if: ${{ steps.experimental_smoke.outcome == 'failure' }}
        continue-on-error: true
        run: npm run smoke:opencode

      - name: Fail when the experimental smoke lane fails
        if: ${{ steps.experimental_smoke.outcome == 'failure' }}
        run: exit 1

  packaging-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Check release metadata
        run: npm run check:release-metadata

      - name: Build Python release artifacts
        run: npm run check:py-build

      - name: Install Python release artifact and verify bundled runtime assets
        run: npm run check:py-install-smoke
