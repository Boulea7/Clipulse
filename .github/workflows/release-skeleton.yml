name: Release Skeleton

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [ -z "${version}" ]; then
            echo "Release version is empty" >&2
            exit 1
          fi

          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate requested release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          case "${RELEASE_VERSION}" in
            '' )
              echo "Missing release version" >&2
              exit 1
              ;;
            *[!0-9A-Za-z.+-]* )
              echo "Unsupported release version: ${RELEASE_VERSION}" >&2
              exit 1
              ;;
          esac

      - name: Verify requested tag exists
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          git rev-parse "refs/tags/v${RELEASE_VERSION}" >/dev/null

      - name: Check out requested release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/tags/v${{ steps.version.outputs.value }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --frozen --group dev

      - name: Run release prep chain
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: npm run check:release:prep

      - name: Bundle stable adapter artifacts
        run: npm run bundle:stable

      - name: Generate stable release asset manifest
        run: node scripts/release-assets.mjs manifest

      - name: Generate stable release checksums
        run: node scripts/release-assets.mjs checksums

      - name: Verify stable release manifest and checksums
        run: npm run check:release-assets:stable

      - name: Export stable release asset paths
        id: release_assets
        shell: bash
        run: |
          node scripts/release-assets.mjs github-output >> "${GITHUB_OUTPUT}"

      - name: Upload stable release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: clipulse-stable-release-${{ steps.version.outputs.value }}
          path: |
            ${{ steps.release_assets.outputs.asset_paths }}
          if-no-files-found: error

      - name: Create or refresh draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.value }}
        shell: bash
        run: |
          release_title="Clipulse ${RELEASE_TAG}"
          manifest_asset="${{ steps.release_assets.outputs.manifest_path }}"
          checksum_asset="${{ steps.release_assets.outputs.checksum_path }}"
          mapfile -t upload_assets < <(printf '%s\n' '${{ steps.release_assets.outputs.asset_paths }}' | sed '/^$/d')
          [ -f "${manifest_asset}" ]
          [ -f "${checksum_asset}" ]

          release_lookup_status=0
          release_lookup_output="$(gh api -i "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>&1)" || release_lookup_status=$?

          if [ "${release_lookup_status}" -eq 0 ]; then
            release_is_draft="$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')"

            if [ "${release_is_draft}" != "true" ]; then
              echo "Refusing to replace assets on a non-draft release: ${RELEASE_TAG}" >&2
              exit 1
            fi

            for asset_path in "${upload_assets[@]}"; do
              asset_name="$(basename "${asset_path}")"
              asset_id="$(gh release view "${RELEASE_TAG}" --json assets --jq ".assets[] | select(.name == \"${asset_name}\") | .id")"

              if [ -n "${asset_id}" ]; then
                gh release delete-asset "${RELEASE_TAG}" "${asset_name}" --yes
              fi

              gh release upload "${RELEASE_TAG}" "${asset_path}"
            done

            gh release edit "${RELEASE_TAG}" \
              --draft \
              --title "${release_title}"
          elif printf '%s' "${release_lookup_output}" | grep -q 'HTTP/[^ ]* 404'; then
            gh release create "${RELEASE_TAG}" \
              "${upload_assets[@]}" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "${release_title}"
          else
            printf '%s\n' "${release_lookup_output}" >&2
            exit "${release_lookup_status}"
          fi
