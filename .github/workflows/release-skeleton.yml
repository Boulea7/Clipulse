name: Release Skeleton

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [ -z "${version}" ]; then
            echo "Release version is empty" >&2
            exit 1
          fi

          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Python dependencies
        run: uv sync --frozen --group dev

      - name: Validate requested release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          case "${RELEASE_VERSION}" in
            '' )
              echo "Missing release version" >&2
              exit 1
              ;;
            *[!0-9A-Za-z.+-]* )
              echo "Unsupported release version: ${RELEASE_VERSION}" >&2
              exit 1
              ;;
          esac

      - name: Verify requested tag exists
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          git rev-parse "refs/tags/v${RELEASE_VERSION}" >/dev/null

      - name: Run release prep chain
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: npm run check:release:prep

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v7
        with:
          name: clipulse-python-${{ steps.version.outputs.value }}
          path: dist/*
          if-no-files-found: error

      - name: Generate release checksums
        shell: bash
        run: |
          shasum -a 256 dist/* > "dist/clipulse-python-${{ steps.version.outputs.value }}-sha256.txt"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v${{ steps.version.outputs.value }}" \
            dist/clipulse_api-* \
            "dist/clipulse-python-${{ steps.version.outputs.value }}-sha256.txt" \
            --draft \
            --verify-tag \
            --target "${GITHUB_SHA}" \
            --generate-notes \
            --title "Clipulse v${{ steps.version.outputs.value }}"
